<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corvas</title>
    <style>
        :root { color-scheme: light; background: #f5f6fa; }
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
        body {
            display: grid;
            place-items: center;
            background: #f5f6fa;
            font-family: "Segoe UI", "PingFang SC", sans-serif;
        }
        .splash {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f5f6fa;
        }
        .splash img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .splash::after {
            position: absolute;
            inset: 0;
            content: "";
            background: linear-gradient(90deg, rgba(245, 246, 250, 0.08), rgba(245, 246, 250, 0.02));
            pointer-events: none;
        }
        .version {
            position: absolute;
            right: 28px;
            bottom: 24px;
            z-index: 1;
            color: rgba(24, 26, 34, 0.7);
            font-size: 12px;
            letter-spacing: 0;
            max-width: calc(100% - 56px);
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body>
    <main class="splash" aria-label="Corvas 正在启动">
        <img src="./assets/splash.jpg" alt="">
        <span class="version" id="splashVersion" aria-label="软件版本"></span>
    </main>
    <script src="./splash.js"></script>
</body>
</html>
