services:
  seedance-direct-adapter:
    image: docker.1ms.run/library/python:3.12-alpine
    container_name: seedance-direct-adapter
    working_dir: /app
    command: [python, -B, adapter.py]
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    mem_limit: 128m
    pids_limit: 96
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      UPSTREAM: http://38.76.169.86:8080
    volumes:
      - ./adapter.py:/app/adapter.py:ro
    networks: [relay-network]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3011/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  relay-network:
    name: ${NETWORK_NAME:-tokensbyte-network}
    external: true
